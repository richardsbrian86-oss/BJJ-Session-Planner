name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bjj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bjj_test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mobile is excluded: its typecheck has type errors and jest fails with
      # "_moduleMocker.clearMocksOnScope is not a function"; fix before enabling.
      - name: Typecheck
        run: pnpm run typecheck:libs && pnpm -r --filter "./artifacts/**" --filter "!@workspace/mobile" --filter "./scripts" --if-present run typecheck

      - name: Build API server and client portal
        run: pnpm --filter @workspace/api-server --filter @workspace/client-portal run build

      - name: Push database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Run API server tests
        run: pnpm --filter @workspace/api-server run test
