name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bjj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bjj_test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # The Expo mobile app has pre-existing type errors and a broken jest
      # setup inherited from the Replit workspace; typecheck everything else.
      - name: Typecheck
        run: pnpm run typecheck:libs && pnpm -r --filter "./artifacts/**" --filter "!@workspace/mobile" --filter "./scripts" --if-present run typecheck

      - name: Push database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Run API server tests
        run: pnpm --filter @workspace/api-server run test
